name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run lint

      - name: Validate Worker bindings
        run: npm run types:check

      - name: Detect D1 migration changes
        id: migration_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            before_sha="${{ github.event.before }}"
            current_sha="${{ github.sha }}"
            modified="$(git diff --diff-filter=M --name-only "$before_sha" "$current_sha" -- 'drizzle/*.sql')"
            if [[ -n "$modified" ]]; then
              echo "::error::Applied migration files must not be modified: $modified"
              exit 1
            fi

            required=false
            while IFS= read -r migration; do
              [[ -z "$migration" ]] && continue
              # This migration was applied to production during the original W15 core cutover,
              # before its source file was restored to the main branch.
              if [[ "$migration" == "drizzle/0015_new_site_core.sql" ]] || git log --format=%H "$before_sha" -- "$migration" | grep -q .; then
                echo "Skipping restored historical migration: $migration"
              else
                required=true
              fi
            done < <(git diff --diff-filter=A --name-only "$before_sha" "$current_sha" -- 'drizzle/*.sql')
            echo "required=$required" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.migration_changes.outputs.required == 'true'
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build application
        run: npm run build

      - name: Run regression tests
        run: node --experimental-strip-types --test tests/rendered-html.test.mjs tests/backup-serialize.test.mjs tests/settlement.test.mjs tests/canonical-url.test.mjs tests/pagination.test.mjs tests/admin-dashboard-filter.test.mjs tests/request-privacy-policy.test.mjs tests/marketing-jobs.test.mjs tests/blog-integration.test.mjs tests/public-blog-cache.test.mjs tests/new-site-core.test.mjs tests/new-site-core-miniflare.test.mjs

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
